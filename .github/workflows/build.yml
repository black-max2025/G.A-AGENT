name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install CLI
        run: npm install

      - name: Unit tests (router, storage, profiles, safety, offline guard)
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Offline build check (no network libraries)
        continue-on-error: true
        run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Build
        run: npm run tauri -- build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GA-AGENT-windows
          path: |
            src-tauri/target/release/ga-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/ga-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe

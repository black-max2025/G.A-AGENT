[package]
name = "ga-agent"
version = "0.1.0"
description = "G.A AGENT - smart, safe disk cleaner with a local GGUF AI brain"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
glob = "0.3"
sha2 = "0.10"
trash = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
